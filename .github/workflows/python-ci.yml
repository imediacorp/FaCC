name: Python CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
  release:
    types: [ created ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.9', '3.10', '3.11', '3.12']

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install system dependencies (required for CAMB Fortran compilation)
      run: |
        sudo apt-get update
        sudo apt-get install -y gfortran libgfortran5

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -r requirements-dev.txt

    - name: Lint — fatal errors only (syntax errors, undefined names)
      run: |
        flake8 src/ tests/ --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Lint — style warnings (advisory, non-blocking)
      run: |
        flake8 src/ tests/ --count --exit-zero --max-complexity=12 --max-line-length=127 --statistics

    - name: Verify core imports
      run: |
        python -c "from src.phi_modulation import PhiModulationModel; print('PhiModulationModel OK')"
        python -c "from src.bayesian_tools import BayesianEvidence, compute_bic; print('bayesian_tools OK')"
        python -c "from src.systematics import SystematicErrorBudget; print('SystematicErrorBudget OK')"
        python -c "from src.hz_analysis import run_hz_analysis; print('hz_analysis OK')"
        python -c "from src.cmb_analysis import run_cmb_analysis; print('cmb_analysis OK')"
        python -c "from src.lss_analysis import run_lss_analysis; print('lss_analysis OK')"

    - name: Run test suite with coverage
      run: |
        pytest tests/ -v --tb=short --cov=src --cov-report=xml --cov-report=term-missing

    - name: Upload coverage report
      uses: codecov/codecov-action@v4
      if: matrix.python-version == '3.11'
      with:
        files: coverage.xml
        fail_ci_if_error: false

  build:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'release'

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install build dependencies
      run: |
        python -m pip install --upgrade pip
        pip install build twine

    - name: Create source distribution
      run: python -m build --sdist --wheel

    - name: Check distribution
      run: twine check dist/*
